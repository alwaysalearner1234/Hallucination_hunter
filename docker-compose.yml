# One command starts the whole stack (API + Postgres + Redis).
# No .env required for boot — the backend falls back to safe defaults and
# reports unconfigured integrations via GET /api/v1/health.
# Copy .env.example to .env only when you need real LLM/search keys.
services:
  postgres:
    image: postgres:15-alpine
    container_name: hh_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hh_password}
      POSTGRES_DB: ${POSTGRES_DB:-hallucination_hunter}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
      - ./database/migrations/002_api_keys.sql:/docker-entrypoint-initdb.d/002_api_keys.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hh_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hh_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hh_backend
    environment:
      PYTHONPATH: /app:/agent
      DATABASE_URL: postgresql+asyncpg://hh_user:hh_password@postgres:5432/hallucination_hunter
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./agent:/agent
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
